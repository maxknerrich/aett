[keys]

[settings]
animate = true
animation_duration = 0.14
animation_fps = 120.0
default_disable = false
focus_follows_mouse = false
hot_reload = true
mouse_follows_focus = false
mouse_hides_on_focus = false
run_on_start = ["{{home}}/.config/rift/register.sh"]

[settings.gestures]
consume_dock_swipe = true
enabled = true
fingers = 4
haptics_enabled = false
skip_empty = true

[settings.layout]
mode = "bsp"

[settings.layout.gaps.inner]
horizontal = 6
vertical = 6

[settings.layout.gaps.outer]
bottom = 6
left = 6
right = 6
top = 6

[settings.ui.menu_bar]
enabled = false

[virtual_workspaces]
auto_assign_windows = false
default_workspace = 0
default_workspace_count = 5
enabled = true
preserve_focus_per_workspace = true
prevent_wrapping = true
workspace_auto_back_and_forth = false
workspace_names = ["1", "2", "3", "4", "5"]
workspace_rules = []

[[virtual_workspaces.app_rules]]
app_id = "com.apple.finder"
floating = true

[virtual_workspaces.app_rules.position]
x = 0.5
y = 0.5

[virtual_workspaces.app_rules.size]
h = 600
w = 875

[[virtual_workspaces.app_rules]]
app_id = "com.apple.systempreferences"
floating = true

[virtual_workspaces.app_rules.position]
x = 0.5
y = 0.5

[virtual_workspaces.app_rules.size]
h = 600
w = 875

[[virtual_workspaces.app_rules]]
app_id = "me.proton.pass.electron"
floating = true

[virtual_workspaces.app_rules.position]
x = 0.5
y = 0.5

[virtual_workspaces.app_rules.size]
h = 600
w = 875

[[virtual_workspaces.app_rules]]
app_id = "com.raycast.macos"
floating = true
title_regex = "^Settings$"

[virtual_workspaces.app_rules.position]
x = 0.5
y = 0.5

[virtual_workspaces.app_rules.size]
h = 600
w = 875

[[virtual_workspaces.app_rules]]
app_id = "app.zen-browser.zen"
floating = true
title_regex = "^Opening .+$"

[[virtual_workspaces.app_rules]]
app_id = "app.zen-browser.zen"
manage = false
title_regex = "^Picture-in-Picture$"
