name: Installer image

on:
  pull_request:
    paths:
      - packages/aett/nix/**
      - .github/workflows/installer.yml
  push:
    branches:
      - main
    paths:
      - packages/aett/nix/**
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build image
        run: |
          nix build \
            --print-build-logs \
            --out-link result \
            ./packages/aett/nix#packages.${{ matrix.system }}.installer

      - name: Prepare assets
        env:
          ISO: aett-installer-${{ matrix.system }}.iso
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "result/iso/$ISO" "dist/$ISO"
          (cd dist && sha256sum "$ISO" >"$ISO.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aett-installer-${{ matrix.system }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: installer-release
      cancel-in-progress: false

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aett-installer-*
          merge-multiple: true
          path: dist

      - name: Verify artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: installer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eEuo pipefail
          cleanup() {
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          trap 'cleanup; exit 1' INT TERM

          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "aett installer" \
            --notes "Installer images for x86_64 and aarch64." \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
          trap - ERR INT TERM
