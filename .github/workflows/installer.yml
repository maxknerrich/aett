name: Installer image

on:
  pull_request:
    paths:
      - packages/aett/src/engine/nix/flake/**
      - .github/workflows/installer.yml
  push:
    branches:
      - main
    paths:
      - packages/aett/src/engine/nix/flake/**
      - .github/workflows/installer.yml
    # A version tag, such as v0.1.0, publishes a release with the installers.
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build image
        run: |
          nix build \
            --print-build-logs \
            --out-link result \
            ./packages/aett/src/engine/nix/flake#packages.${{ matrix.system }}.installer

      # What a running machine builds for itself to switch into the installer without a stick.
      - name: Build kexec installer
        run: |
          nix build \
            --print-build-logs \
            --no-link \
            ./packages/aett/src/engine/nix/flake#packages.${{ matrix.system }}.installer-kexec

      # Named after aett's version, and the commit too unless a version tag built it.
      - name: Prepare assets
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/aett/package.json)
          case "$GITHUB_REF" in
            refs/tags/v*) name=aett-installer-$version-${{ matrix.system }}.iso ;;
            *) name=aett-installer-$version-${GITHUB_SHA::7}-${{ matrix.system }}.iso ;;
          esac
          mkdir -p dist
          cp "result/iso/aett-installer-${{ matrix.system }}.iso" "dist/$name"
          (cd dist && sha256sum "$name" >"$name.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aett-installer-${{ matrix.system }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # A version tag publishes its installers as the release of that tag.
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: installer-release
      cancel-in-progress: false

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aett-installer-*
          merge-multiple: true
          path: dist

      - name: Verify artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.sha256

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eEuo pipefail
          # A tag is released once; rerunning it must not touch the published release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is released already." >&2
            exit 1
          fi

          # Only the draft this run makes is removed when publishing fails.
          cleanup() {
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
              gh release delete "$RELEASE_TAG" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup ERR
          trap 'cleanup; exit 1' INT TERM

          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "aett $RELEASE_TAG" \
            --notes "Installer images for x86_64 and aarch64. Flash one to a USB stick and boot the machine from it." \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
          trap - ERR INT TERM
